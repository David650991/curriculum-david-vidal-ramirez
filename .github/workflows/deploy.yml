name: Validar y publicar portafolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias verificadas
        run: python -m pip install "jinja2>=3.1.4,<4" "pyyaml>=6.0.2,<7" "ruff>=0.6.9,<1" "pytest>=8.3.3,<9"

      - name: Verificar Chrome y fuentes para exportación PDF
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser
          fi
          sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-jetbrains-mono
          (google-chrome --version || chromium-browser --version || chromium --version)

      - name: Revisar calidad del código
        run: ruff check .

      - name: Ejecutar pruebas
        run: pytest

      - name: Generar sitio estático
        run: python main.py

      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Subir artefacto público
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request'
    needs: calidad
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
