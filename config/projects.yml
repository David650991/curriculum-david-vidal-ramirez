PROJECTS:
  - slug: "generador-expedientes"
    priority: 1
    categories: ["Aplicaciones web", "Backend", "Automatización", "Seguridad"]
    title: "Generador de Expedientes de Entrevista"
    category: "Aplicación full stack serverless"
    status: "Uso institucional privado"
    status_kind: "private"
    featured: true
    monogram: "GE"
    image: "assets/images/projects/generador-expedientes-entrevista-conceptual.jpg"
    image_label: "Representación conceptual anonimizada"
    image_width: 1586
    image_height: 992
    summary: "Sistema privado para preparar, firmar, versionar y auditar expedientes legales y administrativos de entrevistas audiovisuales."
    problem: "El proceso exigía preparar numerosos documentos relacionados, repetir datos, reunir firmas y conservar trazabilidad sin perder el control de versiones."
    contribution: "Diseñé y desarrollé el flujo completo: captura guiada, reglas que determinan qué documentos corresponden, firmas, persistencia, permisos y seguimiento de cambios."
    operation: "La interfaz está construida con Web Components y se comunica con funciones serverless. Cloudflare Access protege el acceso; D1 conserva los datos y el sistema controla versiones y ediciones simultáneas."
    scope: "Es mi proyecto con mayor amplitud funcional: reúne 25 documentos, invitaciones, papelera, auditoría, firmas secuenciales y pruebas. El repositorio es privado porque maneja un proceso institucional."
    highlights: ["Expedientes versionados y 25 documentos configurados", "Reglas de aplicabilidad y reutilización de datos", "Firmas manuscritas, búsqueda, administración e impresión", "Papelera, restauración, auditoría e invitaciones", "Persistencia remota y control optimista de concurrencia"]
    aspects: "Modelado documental, autenticación, autorización, firmas electrónicas, auditoría y concurrencia."
    architecture: ["Web Components", "Pages Functions", "Cloudflare D1"]
    stack: ["HTML5", "CSS3", "JavaScript", "Web Components", "Canvas API", "Cloudflare Pages", "Pages Functions", "Cloudflare D1", "SQLite", "Cloudflare Access", "JWT", "Google Identity", "SHA-256"]
    demo_url: "https://generador-expedientes-podcast.pages.dev/"
    repository_url: null
    note: "Código privado; la demostración requiere autorización."
  - slug: "la-luz-esperanza"
