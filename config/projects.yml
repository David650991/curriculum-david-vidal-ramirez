    problem: "El centro necesitaba una presencia pública clara que concentrara su información, servicios, contenido y canales de contacto."
    contribution: "Me encargué de la estructura, la interfaz, la publicación y las integraciones. El sitio funciona como la presencia pública del centro y como punto de entrada hacia sus medios de contacto."
