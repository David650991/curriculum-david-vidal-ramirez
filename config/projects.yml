  - slug: "visionlab"
    priority: 4
    categories: ["Aplicaciones web", "Visión computacional"]
    title: "VisionLab"
    category: "Visión computacional en navegador"
    status: "Laboratorio experimental"
    status_kind: "experimental"
    featured: false
    monogram: "VL"
    image: "assets/images/projects/visionlab-vision-computacional-conceptual.jpg"
    image_label: "Representación conceptual anonimizada"
    image_width: 1586
    image_height: 992
    summary: "Aplicación estática para experimentar con bordes, contornos, detección facial, landmarks y expresiones aparentes."
    problem: "Se buscaba observar técnicas de visión computacional directamente en el navegador, manteniendo las imágenes en el dispositivo del usuario."
    contribution: "Preparé una interfaz donde se puede cargar una imagen y observar diferentes etapas del procesamiento sin enviar el archivo a un servidor."
    operation: "OpenCV.js trabaja con bordes y contornos sobre Canvas; face-api.js ejecuta detección facial, 68 puntos de referencia y estimaciones de expresión en el navegador."
    scope: "Su finalidad es educativa. No identifica personas, no debe utilizarse para tomar decisiones sensibles y sus resultados dependen de la imagen y de los modelos empleados."
    highlights: ["Detección de bordes Canny y contornos", "Clasificación heurística de formas", "Detección facial y 68 landmarks", "Estimación experimental de expresiones", "Procesamiento local sin API, fetch, XHR ni WebSockets"]
    aspects: "Procesamiento de imágenes, memoria WebAssembly, Canvas, detección facial y modelos ejecutados en navegador."
    architecture: ["Imagen local", "Canvas y modelos web", "Resultado en navegador"]
    stack: ["HTML5", "CSS3", "JavaScript", "OpenCV.js", "face-api.js", "Canvas API", "AdminLTE"]
    demo_url: null
    repository_url: "https://github.com/David650991/visionlab"
