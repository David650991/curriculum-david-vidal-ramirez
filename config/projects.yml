  - slug: "generador-expedientes-usuarios-consejeros"
    priority: 10
    categories: ["Aplicaciones web", "Automatización"]
    title: "Generador de Expedientes de Personas Usuarias y Consejeros"
    category: "Documentación institucional modular"
    status: "Prototipo en desarrollo"
    status_kind: "experimental"
    featured: false
    monogram: "EC"
    summary: "Prototipo web modular para organizar documentación institucional, controlar el avance de 32 formatos y preparar contratos con captura de firmas manuscritas desde pantalla."
    problem: "Se necesitaba organizar los formatos de un expediente y facilitar la preparación de documentos sin repetir manualmente la misma información en cada formulario."
    contribution: "Diseñé una estructura modular para el control documental y los dos módulos de contratos descritos en el proyecto, utilizando componentes reutilizables para campos, vistas previas, firmas y preparación de impresión."
    operation: "El catálogo permite llevar el seguimiento de 32 formatos, pero esto no significa que existan 32 formularios completos. Los dos módulos de contratos descritos utilizan captura de datos y vista previa. Las firmas manuscritas se dibujan en pantalla mediante Canvas. El avance del control documental se conserva en localStorage; los documentos pueden imprimirse o guardarse como PDF mediante el navegador."
    scope: "Prototipo en desarrollo cuya descripción procede de la documentación facilitada por el autor. Su código todavía no ha sido auditado directamente para este currículum. No se ha verificado un servidor, base de datos, autenticación, sincronización de documentos ni firma digital criptográfica."
    highlights: ["Catálogo y seguimiento de 32 formatos documentales", "Dos módulos de contratos descritos como implementados", "Formularios y vistas previas con componentes reutilizables", "Captura de firmas manuscritas mediante Canvas y eventos de puntero", "Preparación de documentos tamaño carta para impresión o PDF desde el navegador"]
    aspects: "Arquitectura modular frontend, formularios, reutilización de componentes, Canvas, eventos de puntero, seguimiento documental y estilos de impresión."
    architecture: ["Interfaz HTML y CSS", "Módulos JavaScript", "Componentes documentales y Canvas", "Impresión desde el navegador"]
    stack: ["HTML5", "CSS3", "JavaScript", "Canvas API"]
    demo_url: null
    repository_url: null
