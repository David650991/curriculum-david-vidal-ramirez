    summary: "Micrositio servido con Express para experimentar con publicación Node.js en un entorno ARM64/Android."
    contribution: "Preparé el servidor y una interfaz ligera para comprobar que podía levantar y administrar una aplicación Node.js desde un dispositivo ARM64 con Termux."
