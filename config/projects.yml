  - slug: "auth-practice"
    priority: 2
    categories: ["Backend", "Seguridad", "Visión computacional"]
    title: "Auth Practice"
    category: "Laboratorio de seguridad e identidad"
    status: "Experimental"
    status_kind: "experimental"
    featured: true
    monogram: "AP"
    image: "assets/images/projects/auth-practice-seguridad-conceptual.jpg"
    image_label: "Representación conceptual anonimizada"
    image_width: 1586
    image_height: 992
    summary: "Laboratorio Flask de autenticación por contraseña, correo, TOTP, códigos de recuperación, SMS y comparación facial."
    problem: "Era necesario estudiar, dentro de un entorno controlado, cómo conviven varios factores de autenticación y sus flujos de recuperación."
    contribution: "Lo construí para entender cómo se relacionan distintos factores de autenticación y cómo separar responsabilidades en una aplicación Flask."
    operation: "Usa una fábrica de aplicación, blueprints, SQLAlchemy y SQLite. Las prácticas incluyen contraseñas con bcrypt, tokens firmados, límites de intentos, TOTP y comparación facial experimental."
    scope: "Es un laboratorio técnico, no un proveedor de identidad. Antes de usarlo con cuentas reales necesitaría auditoría, gestión segura de secretos, pruebas de ataque y políticas operativas."
    highlights: ["Application factory y blueprints modulares", "Registro, confirmación de correo y recuperación de contraseña", "Bcrypt, sesiones, tokens firmados y rate limiting", "TOTP, SMS y códigos de recuperación", "Comparación facial experimental con OpenCV y Dlib"]
    aspects: "Arquitectura Flask, gestión de sesiones, factores de autenticación, limitación de intentos y biometría experimental."
    architecture: ["Cliente web", "Blueprints Flask", "SQLAlchemy y SQLite"]
    stack: ["Python", "Flask", "Flask-SQLAlchemy", "SQLite", "Flask-Login", "Flask-Bcrypt", "Flask-Mail", "Flask-Limiter", "PyOTP", "OpenCV", "Dlib", "face_recognition", "NumPy", "JavaScript", "Jinja2"]
    demo_url: null
