    summary: "Aplicación estática para experimentar con bordes, contornos, detección facial, landmarks y expresiones aparentes."
    problem: "Se buscaba observar técnicas de visión computacional directamente en el navegador, manteniendo las imágenes en el dispositivo del usuario."
