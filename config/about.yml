HEADER:
  eyebrow: "Perfil profesional"
  title: "Aprendo construyendo soluciones para problemas que conozco de cerca"
PRESENTATION:
  lead: "Soy David Vidal Ramírez, desarrollador de software y estudiante de Ingeniería en Sistemas Computacionales. Actualmente curso el 3.er semestre en modalidad en línea dentro del Tecnológico Nacional de México."
  paragraphs:
    - "Mi trabajo se ha enfocado en soluciones web y herramientas digitales aplicadas a necesidades reales: sistemas documentales, comunicación en tiempo real, autenticación multifactor experimental, visión computacional, sitios institucionales, automatización y despliegue."
    - "Trabajo principalmente con Python, JavaScript, HTML, CSS, Flask, Node.js, Express, SQLite, Cloudflare, GitHub Actions y tecnologías web modernas. También he desarrollado proyectos con OpenCV, procesamiento de imágenes, WebSockets, PWA y bases de datos."
    - "Antes de concentrarme en tecnología trabajé en logística, ventas, operación y atención al cliente. Esa trayectoria influye en mi forma de desarrollar software: primero procuro entender el problema y ordenar el proceso; después construyo una solución que pueda mantenerse y evolucionar."
    - "Una parte importante de mi trabajo nació en La Luz y La Esperanza Que Necesito: desarrollé su sitio público y después una herramienta privada para preparar expedientes, recopilar firmas y conservar la trazabilidad de cada cambio."
